<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>AionSite Leads</title>
  <defs>
    <linearGradient id="leadLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8be6d4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <image href="/icon.png" x="32" y="32" width="416" height="416" preserveAspectRatio="xMidYMid meet"/>
  <g fill="none" stroke="url(#leadLine)" stroke-linecap="round" stroke-width="12" filter="url(#softGlow)">
    <path d="M296 313c38-4 63-22 83-51"/>
    <path d="M296 313c37 10 59 27 77 57"/>
  </g>
  <g fill="#0f766e" stroke="#d9f3ef" stroke-width="7" filter="url(#softGlow)">
    <circle cx="296" cy="313" r="20"/>
    <circle cx="382" cy="257" r="20"/>
    <circle cx="375" cy="371" r="20"/>
  </g>
</svg>
